openapi: 3.0.3
info:
  title: CypherFox Backend API
  description: API para la evaluación de algoritmos criptográficos y gestión académica de la plataforma CypherFox.
  version: 1.0.0
servers:
  - url: http://localhost:4000/api
    description: Servidor de Desarrollo
  - url: https://cypherfox.onrender.com/api
    description: Servidor de Producción

tags:
  - name: General
    description: Endpoints de estado del sistema y descubrimiento.
  - name: Auth
    description: Gestión de sesiones e identidad (integrado con Supabase).
  - name: Admin
    description: Herramientas de gestión para profesores (Listado de notas y perfiles).
  - name: Evaluate
    description: Motor de evaluación de algoritmos criptográficos.

paths:
  /:
    get:
      tags: [General]
      summary: Descubrimiento de API
      description: Retorna información básica sobre el servicio y los endpoints disponibles.
      responses:
        '200':
          description: Successful discovery
          content:
            application/json:
              schema:
                type: object
                properties:
                  service: { type: string, example: "CypherFox Backend" }
                  basePath: { type: string, example: "/api" }
                  availableCalls: { type: object }

  /health:
    get:
      tags: [General]
      summary: Health Check (Estado de Salud)
      description: Retorna el estado del servicio y el timestamp actual del servidor.
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  timestamp: { type: string, format: date-time }

  /heartbeat:
    get:
      tags: [General]
      summary: Heartbeat
      description: Endpoint simple para verificar que el servidor responde a las peticiones.
      responses:
        '200':
          description: Server is alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean, example: true }
                  timestamp: { type: string, format: date-time }
                  response: { type: string, example: "thump-thump" }

  /auth/me:
    get:
      tags: [Auth]
      summary: Obtener perfil actual
      description: Retorna los datos del usuario autenticado (@unal.edu.co), incluyendo sus mejores notas consolidadas por algoritmo.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil de usuario obtenido con éxito.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/Profile'

  /admin/grades-report:
    post:
      tags: [Admin]
      summary: Generar reporte de notas (Excel)
      description: Genera un archivo .xlsx con las notas finales y promedios de una lista de estudiantes. Requiere rol de profesor. Soporta payloads cifrados.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: '#/components/schemas/GradesReportRequest'
                - type: object
                  required: [payload, iv]
                  properties:
                    payload: { type: string, description: "Request cifrado en Base64" }
                    iv: { type: string, description: "IV en Base64" }
      responses:
        '200':
          description: Archivo Excel generado correctamente.
          content:
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary

  /evaluate:
    post:
      tags: [Evaluate]
      summary: Evaluar código criptográfico
      description: Procesa y valida implementaciones enviadas por estudiantes. La petición debe viajar cifrada.
      security:
        - bearerAuth: []
      parameters:
        - name: method
          in: query
          required: true
          description: El algoritmo a evaluar.
          schema:
            type: string
            enum: [caesar, vigenere, one-time-pad, playfair, hill, homophonic, turning-grille, des, aes, rsa, gamal]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [payload]
              properties:
                payload:
                  type: string
                  description: JSON cifrado con AES-256-GCM que contiene el código fuente del estudiante.
      responses:
        '200':
          description: Resultados de la evaluación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluationResult'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Profile:
      type: object
      properties:
        id: { type: string, format: uuid }
        nombre: { type: string }
        correo: { type: string }
        rol: { type: string, enum: [student, teacher] }
        notas:
          type: array
          items:
            type: object
            properties:
              metodo: { type: string }
              nota: { type: number }

    GradesReportRequest:
      type: object
      required: [studentEmails, deadlines]
      properties:
        studentEmails:
          type: array
          items: { type: string, format: email }
        deadlines:
          type: array
          items:
            type: object
            properties:
              algoritmo: { type: string }
              fecha: { type: string, format: date-time }

    Submission:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: string, format: uuid }
        algoritmo: { type: string }
        raw_score: { type: number, format: float }
        passed_cases: { type: integer }
        total_cases: { type: integer }
        submitted_at: { type: string, format: date-time }

    EvaluationResult:
      type: object
      properties:
        method: { type: string }
        score: { type: number, description: "Nota final de 0.0 a 5.0" }
        passed: { type: integer }
        total: { type: integer }
        encrypt:
          $ref: '#/components/schemas/TestSummary'
        decrypt:
          $ref: '#/components/schemas/TestSummary'

    TestSummary:
      type: object
      properties:
        passed: { type: integer }
        total: { type: integer }
        results:
          type: array
          items:
            type: object
            properties:
              passed: { type: boolean }
              feedback: { type: string }

    ErrorResponse:
      type: object
      properties:
        message: { type: string }
        hint: { type: string }